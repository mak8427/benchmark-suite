name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt
      - run: python -m pip install --upgrade pip pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-cov
      - run: python -m pytest tests -v --tb=short --cov=src/benchwrap --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Build and Install Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt
      - run: bash .ci/scripts/check-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_benchmark_outputs.py tests/test_benchmark_scripts.py -v --tb=short

  slurm-e2e:
    name: Slurm E2E
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: koesterlab/setup-slurm-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            src/requirements.txt
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install dist/*.whl
      - run: bash .ci/scripts/slurm-e2e.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: bash .ci/scripts/security.sh

  dependency-drift:
    name: Dependency Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r src/requirements.txt
      - run: python -m pip list --outdated
