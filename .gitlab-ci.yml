workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - package
  - e2e
  - security
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12
  cache:
    key:
      files:
        - pyproject.toml
        - src/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python --version
    - python -m pip install --upgrade pip

lint:
  stage: lint
  allow_failure: true
  script:
    - python -m pip install pre-commit
    - pre-commit run --all-files --show-diff-on-failure

unit-tests:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  image: python:${PYTHON_VERSION}
  script:
    - python -m pip install -e . pytest pytest-cov
    - python -m pytest tests -v --tb=short --cov=src/benchwrap --cov-report=xml --cov-report=term-missing
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

benchmark-smoke:
  stage: test
  script:
    - python -m pip install -e . pytest
    - python -m pytest tests/test_benchmark_outputs.py tests/test_benchmark_scripts.py -v --tb=short

package:
  stage: package
  script:
    - bash .ci/scripts/check-package.sh
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

slurm-e2e:
  stage: e2e
  needs: ["package"]
  tags:
    - slurm
  rules:
    - if: $RUN_SLURM_E2E == "1"
    - when: manual
      allow_failure: true
  script:
    - python -m pip install pytest dist/*.whl
    - bash .ci/scripts/slurm-e2e.sh

slurm-campaign:
  stage: e2e
  needs: ["package"]
  tags:
    - slurm
  variables:
    BENCHWRAP_CAMPAIGN_PARTITION: "medium"
    BENCHWRAP_CAMPAIGN_RUNS: "3"
    BENCHWRAP_CAMPAIGN_ARTIFACTS: "campaign-artifacts"
  rules:
    - if: $RUN_SLURM_CAMPAIGN == "1"
    - when: manual
      allow_failure: true
  script:
    - python -m pip install dist/*.whl
    - bash .ci/scripts/slurm-campaign.sh
  artifacts:
    when: always
    paths:
      - campaign-artifacts/
    expire_in: 2 weeks

security:
  stage: security
  script:
    - bash .ci/scripts/security.sh

dependency-drift:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - python -m pip install -r src/requirements.txt
    - python -m pip list --outdated

release:
  stage: release
  needs: ["package"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Pipeline artifacts"
          url: "$CI_PIPELINE_URL"
